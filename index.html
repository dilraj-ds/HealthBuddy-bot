<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthBuddy Chatbot</title>

<style>

/* ===== Page Styling ===== */

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ===== Main Container ===== */

.container{
    text-align:center;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0px 8px 25px rgba(0,0,0,0.2);
    width:450px;
}

h1{
    color:#2c3e50;
    margin-bottom:10px;
}

p{
    color:#555;
    font-size:16px;
}

/* ===== Button Styling ===== */

.btn{
    margin-top:20px;
    padding:12px 25px;
    background:#4facfe;
    border:none;
    color:white;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#007bff;
}

/* ===== Footer ===== */

footer{
    margin-top:20px;
    font-size:14px;
    color:#888;
}

</style>
</head>

<body>

<div class="container">
    <h1>🩺 HealthBuddy</h1>
    <p>Your Smart Healthcare Assistant</p>
    <p>Click the chat icon at bottom-right to start chatting with HealthBuddy.</p>

    <button class="btn">Start Chat</button>

    <footer>
        Powered by IBM Watson Assistant
    </footer>
</div>


<!-- ===== Watson Assistant Chatbot Script ===== -->

<script>
window.watsonAssistantChatOptions = {
  integrationID: "8ea9bd65-b146-4cb8-8483-eaca4171b45f",
  region: "eu-de",
  serviceInstanceID: "fc5b6242-e30a-4605-a8c4-8f47c7a75bf9",
  onLoad: async (instance) => { await instance.render(); }
};

setTimeout(function(){
  const t=document.createElement('script');
  t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" +
  (window.watsonAssistantChatOptions.clientVersion || 'latest') +
  "/WatsonAssistantChatEntry.js";
  document.head.appendChild(t);
});
</script>

</body>
</html>
